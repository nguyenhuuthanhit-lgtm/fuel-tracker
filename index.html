<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoTracker - L/100km & Bảo Dưỡng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Top Navigation -->
    <nav class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i data-lucide="gauge" class="w-7 h-7 text-emerald-400"></i>
                <span class="font-bold text-xl bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">AutoTracker</span>
            </div>
            <div class="flex items-center gap-2" id="nav-actions">
                <button onclick="openModal('modal-auth')" class="bg-emerald-600 hover:bg-emerald-500 px-3.5 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
                    <i data-lucide="user" class="w-4 h-4"></i>
                    <span id="auth-btn-text">Đăng nhập / Đăng ký</span>
                </button>
                <button onclick="openModal('modal-config')" class="bg-slate-700 hover:bg-slate-600 p-2 rounded-lg text-amber-400 transition" title="Cấu hình Key Supabase">
                    <i data-lucide="key" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Vehicle Selection Bar -->
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <i data-lucide="car" class="w-6 h-6 text-emerald-400"></i>
                <div>
                    <label class="text-xs text-slate-400 block font-medium">Chọn phương tiện</label>
                    <select id="vehicle-select" onchange="switchVehicle(this.value)" class="bg-slate-900 border border-slate-600 rounded-lg px-3 py-1.5 text-sm font-semibold text-emerald-400 focus:outline-none">
                        <option value="">-- Chưa có xe nào --</option>
                    </select>
                </div>
            </div>
            <button onclick="openModal('modal-vehicle')" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-1.5">
                <i data-lucide="plus-circle" class="w-4 h-4"></i> Thêm xe
            </button>
        </div>

        <!-- Dashboard Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <div class="flex justify-between text-slate-400 mb-2">
                    <span class="text-sm font-medium">Định mức L/100km</span>
                    <i data-lucide="fuel" class="w-5 h-5 text-emerald-400"></i>
                </div>
                <div class="text-3xl font-bold text-emerald-400" id="stat-avg-consumption">0.0 <span class="text-sm font-normal text-slate-400">L/100km</span></div>
                <p class="text-xs text-slate-400 mt-2">Trung bình các lần đổ xăng</p>
            </div>

            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <div class="flex justify-between text-slate-400 mb-2">
                    <span class="text-sm font-medium">Tổng tiền xăng</span>
                    <i data-lucide="droplet" class="w-5 h-5 text-cyan-400"></i>
                </div>
                <div class="text-3xl font-bold text-cyan-400" id="stat-total-fuel-cost">0 <span class="text-sm font-normal text-slate-400">VNĐ</span></div>
                <p class="text-xs text-slate-400 mt-2" id="stat-total-liters">0 Lít nhiên liệu</p>
            </div>

            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <div class="flex justify-between text-slate-400 mb-2">
                    <span class="text-sm font-medium">Tổng tiền bảo dưỡng</span>
                    <i data-lucide="wrench" class="w-5 h-5 text-amber-400"></i>
                </div>
                <div class="text-3xl font-bold text-amber-400" id="stat-total-maint-cost">0 <span class="text-sm font-normal text-slate-400">
